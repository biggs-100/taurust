[package]
name = "tau-coding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The taurust coding application: CLI, tools, sessions, resources"

[dependencies]
tau-protocol.workspace = true
tau-agent.workspace = true
tau-ai.workspace = true
sha2.workspace = true
dirs.workspace = true
image.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true

[[bin]]
name = "tau"
path = "src/main.rs"
