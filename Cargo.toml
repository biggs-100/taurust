[workspace]
resolver = "3"
members = [
    "crates/tau-protocol",
    "crates/tau-ai",
    "crates/tau-agent",
    "crates/tau-coding",
    "crates/tau-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Rust port of the tau coding agent, with the gentle-shell terminal experience"

[workspace.dependencies]
tau-protocol = { path = "crates/tau-protocol" }
tau-ai = { path = "crates/tau-ai" }
tau-agent = { path = "crates/tau-agent" }
tau-coding = { path = "crates/tau-coding" }
tau-tui = { path = "crates/tau-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
futures-util = "0.3"
futures-executor = "0.3"
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
